name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Security audit
        run: pnpm audit --audit-level moderate --prod
      - name: Clone test data
        run: |
          git clone https://${{ secrets.XWORD_PARSER_TESTDATA_PAT }}@github.com/mjkoo/xword-parser-testdata.git testdata
      - name: Format check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint:check
      - name: Type check
        run: pnpm run typecheck
      - name: Run tests with coverage
        run: CI=true pnpm run test:coverage
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.node-version == '24.x' }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./test-results.xml
          flags: unit-tests
          name: unit-test-results
      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit-tests
          name: unit-tests
          fail_ci_if_error: true
      - name: Run fuzz regression tests
        run: pnpm exec vitiate regression
